<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNAPSTIC STUDIOS</title>
  <meta name="description" content="Designing minimal, reliable products that blend art, logic and emotion." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2300d4ff'/%3E%3C/svg%3E" />
  <style>
    :root{
      --bg: #0b0c10;
      --fg: #e9edf1;
      --muted: #a8b0bb;
      --brand1: 264;
      --brand2: 198;
      --brand3: 142;
      --radius: 18px;
      --pad: clamp(16px, 2.5vw, 28px);
      --max: 860px;
    }
    html, body { height: 100%; }
    *{ box-sizing: border-box }
    body{
      margin:0; font: 400 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg); background: var(--bg);
      display:grid; place-items:center;
      overflow:hidden;
    }
    .backdrop{
      position:fixed; inset:-20vmax;
      background: radial-gradient(60vmax 60vmax at var(--mx,50%) var(--my,50%),
        hsl(var(--brand2) 70% 12% / .9), transparent 60%),
        radial-gradient(40vmax 40vmax at calc(100% - var(--mx,50%)) calc(100% - var(--my,50%)),
        hsl(var(--brand1) 90% 16% / .8), transparent 55%),
        linear-gradient(#07070a, #0b0c10);
      filter: saturate(1.2) contrast(1.05);
      transition: background-position .2s ease;
      pointer-events:none;
      z-index:0;
    }
    .card{
      position:relative; z-index:1; width:min(100%, var(--max));
      margin: 0 var(--pad);
      border: 1px solid rgba(255,255,255,.08);
      background: color-mix(in oklab, white 2%, transparent);
      backdrop-filter: blur(8px) saturate(1.1);
      border-radius: calc(var(--radius) * 1.2);
      padding: calc(var(--pad) * 1.25);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    header{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .logo-wrap{ width:70px; height:70px; border-radius:20px; display:grid; place-items:center;
      background: linear-gradient(135deg, hsl(var(--brand2) 95% 58%), hsl(var(--brand1) 95% 58%));
      filter: hue-rotate(var(--hue,0deg));
      transition: filter .5s ease, transform .4s ease;
      cursor: pointer;
    }
    .logo-wrap:hover{ transform: translateY(-2px); }
    h1{ font-size: clamp(28px, 4.5vw, 44px); line-height:1.15; margin:0 }
    .tag{ color: var(--muted); margin-top:4px; font-size: clamp(14px, 2.2vw, 16px) }
    .hero-graphic{
      width: 180px; height: 180px; margin-left:auto; opacity:.9;
      filter: hue-rotate(var(--hue,0deg));
      transition: filter .5s ease;
    }
    .links{ margin-top: 22px; display:flex; gap:12px; flex-wrap:wrap }
    .btn{
      --c: hsl(var(--brand2) 100% 60%);
      display:inline-flex; align-items:center; gap:10px;
      border: 1px solid color-mix(in oklab, var(--c) 38%, white 0%);
      color: var(--fg); text-decoration:none; padding:10px 14px;
      border-radius: 999px; position:relative; overflow:hidden;
      transition: transform .2s ease, border-color .2s ease;
      background: linear-gradient(180deg, color-mix(in oklab, var(--c) 14%, transparent), transparent);
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background: radial-gradient(60% 140% at var(--mx,50%) var(--my,50%), color-mix(in oklab, var(--c) 30%, transparent), transparent 40%);
      opacity:.0; transition: opacity .25s ease;
    }
    .btn:hover::after{ opacity: .9 }
    .blurb{ margin-top: 18px; color: var(--muted); max-width: 60ch }
    footer{ margin-top: 18px; opacity:.6; font-size: 13px }
    @media (max-width: 820px){
      header{ align-items: flex-start }
      .hero-graphic{ display:none }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="card" role="main">
    <header>
      <!-- Interactive brand tile / logo -->
      <button class="logo-wrap" id="logo" aria-label="Toggle brand hue">
        <img src="your-image.png" alt="Logo" width="40" height="40" />
      </button>
      <div>
        <h1>YOUR NAME</h1>
        <p class="tag">Designing minimal, reliable experiences across physical & digital. Available for collaborations.</p>
        <div class="links" aria-label="Primary links">
          <a class="btn" href="mailto:you@domain.com" data-c="198">Email</a>
          <a class="btn" href="https://instagram.com/yourhandle" target="_blank" rel="noopener" data-c="264">Instagram</a>
          <a class="btn" href="https://tiktok.com/@yourhandle" target="_blank" rel="noopener" data-c="142">TikTok</a>
        </div>
        <p class="blurb">Small studio mindset; engineering discipline. I like clean forms, honest materials, and playful interactions that reward curiosity.</p>
        <footer>© <span id="y"></span> YOUR NAME</footer>
      </div>
      <svg class="hero-graphic" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(var(--brand2) 100% 60%)"/>
            <stop offset="100%" stop-color="hsl(var(--brand1) 100% 60%)"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="64" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.9"/>
        <circle cx="100" cy="100" r="46" fill="none" stroke="url(#grad)" stroke-width="1.2" opacity="0.7"/>
        <circle cx="100" cy="100" r="28" fill="none" stroke="url(#grad)" stroke-width="1.2" opacity="0.6"/>
        <circle cx="164" cy="84" r="4" fill="url(#grad)"/>
        <circle cx="124" cy="140" r="3" fill="url(#grad)"/>
        <circle cx="70" cy="60" r="2.5" fill="url(#grad)"/>
      </svg>
    </header>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const root = document.documentElement;
    function move(e){
      const x = e.clientX / window.innerWidth * 100;
      const y = e.clientY / window.innerHeight * 100;
      root.style.setProperty('--mx', x + '%');
      root.style.setProperty('--my', y + '%');
    }
    window.addEventListener('mousemove', move);
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('mousemove', (e)=>{
        const rect = btn.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width * 100;
        const y = (e.clientY - rect.top) / rect.height * 100;
        btn.style.setProperty('--mx', x + '%');
        btn.style.setProperty('--my', y + '%');
        const c = btn.getAttribute('data-c');
        btn.style.setProperty('--c', `hsl(${c} 100% 60%)`);
      });
    });
    (function(){
      const logo = document.getElementById('logo');
      const hues = [0, 40, 90, 140, 200, 260, 320];
      let i = 0;
      logo.addEventListener('click', ()=>{
        i = (i + 1) % hues.length;
        document.body.style.setProperty('--hue', hues[i] + 'deg');
      });
    })();
    document.getElementById('logo').addEventListener('keydown', (e)=>{
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); e.currentTarget.click(); }
    });
  </script>
</body>
</html>
